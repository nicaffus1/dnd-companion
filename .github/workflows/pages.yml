name: Test and deploy Pages
on:
  push:
    branches: [main, release-1.0, dice-overhaul, dice-preview, dice-overhead, dice-resin, dice-colors]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate mobile icons
        run: |
          python -m pip install cairosvg
          python -c "import cairosvg; [cairosvg.svg2png(url='public/icon.svg',write_to='public/icon-%d.png'%s,output_width=s,output_height=s) for s in (192,512)]"
      - run: npm install
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
